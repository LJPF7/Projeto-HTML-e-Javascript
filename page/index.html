<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon -->
    <link rel="shortcut icon" href="../assets/img/favicon.ico" type="image/x-icon">

    <!-- Bootstrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Google Fonts -->
    <!-- Josefin Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">

    <!-- Dancing Scripts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Playwrite+DE+SAS:wght@100..400&display=swap"
        rel="stylesheet">

    <!-- bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Meu css -->
    <link rel="stylesheet" href="../assets/css/style.css">

    <title>Minha Lista de Tarefas</title>
</head>
<body>
    <header>
        <!-- Início Navbar do Bootstrap -->
        <nav class="navbar" id="navbar-login">
            <div class="container-fluid">
                <a href="../page/index.html" class="navbar-brand">Minha Lista de Tarefas</a>
                <form class="d-flex" role="dialog" method="dialog">
                    <input id="form-email" class="form-control me-2" type="email" placeholder="Email" aria-label="Email"/>
                    <input id="form-password" class="form-control me-2" type="password" placeholder="Palavra-passe"
                        aria-label="Palavra-passe"/>
                    <a href="../page/sessao.html" class="btn btn-primary text-nowrap" type="button min-width: 140px">Iniciar sessão</button></a>
                        
                    <!-- Trigger Button do Modal -->
                    <button id="form-registo" class="btn btn-info ms-2 text-nowrap" type="button min-width: 140px"
                        data-bs-toggle="modal" data-bs-target="#exampleModal">Registar-se</button>
                </form>
            </div>
        </nav>
        <!-- Fim Navbar do Bootstrap -->
    </header>

    <main>
        <!-- Início Responsive Container do Bootstrap -->
        <div class="container-sm-md-lg">
            <p id="mensagem-bem-vindo">Bem-vindo</p>
            <img src="../assets/img/lista_de_tarefas.jpg" alt="Minha lista de tarefas" id="imagem-lista-tarefas"
                onmouseover="mostrarTexto()" onmouseout="esconderTexto()">
        </div>
        <!-- Fim Responsive Container do Bootstrap -->
    </main>

    <footer>
        <div class="container-fluid fixed-bottom">
            <p>&copy;2026 Leandro Ferreira - Minha Lista de Tarefas</p>
        </div>
    </footer>

    <!-- Início Modal do Bootstrap - formulário de registo de novo utilizador -->
    <div class="modal fade modal-personalizado" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">

                <!-- Início <form> -->
                <form id="meu-formulario-novo-utilizador" action="" method="get">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">Registar-se</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">

                        <!-- Utilizador -->
                        <div class="mb-3">
                            <label for="form-utilizador" class="form-label">Utilizador</label>
                            <input class="form-control" id="form-utilizador" rows="3"
                                placeholder="Insira o teu nome de utilizador" type="text"></input>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="form-email2" class="form-label">Email</label>
                            <input class="form-control" id="form-email2" rows="3"
                                placeholder="Insira o teu email" type="email"></input>
                        </div>

                        <!-- Palavra-passe -->
                        <div class="mb-3">
                            <label for="form-password2" class="form-label">Palavra-passe</label>
                            <input class="form-control" id="form-password2" rows="3"
                                placeholder="Insira a tua palavra-passe" type="password"></input>
                        </div>

                        <!-- Confirmar a palavra-passe -->
                        <div class="mb-3">
                            <label for="form-confirma-password" class="form-label">Confirmar palavra-passe</label>
                            <input class="form-control" id="form-confirma-password" rows="3"
                                placeholder="Confirma a tua palavra-passe" type="password"></input>
                        </div>

                        <span id="mensagem-erro" style="color: red; display: none; margin-top: 10px; margin-left: 5%;"></span>

                    </div>
                    <div class="modal-footer">
                        <button id="btn-cancelar-rgisto" type="button" class="btn btn-light btn-light-personalizado"
                            data-bs-dismiss="modal">Cancelar</button>

                            <!-- Trigger Button do Toast - formulário de registo de novo utilizador -->
                        <button type="submit" class="btn btn-primary" id="btn-submeter-novo-utilizador">Submeter</button>
                    </div>
                </form>
                <!-- Fim <form> -->

            </div>
        </div>
    </div>
    <!-- Fim Modal do Bootstrap -->

    <!-- Início Toast do Bootstrap (notificação de novo utilizador adicionado) -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div class="toast" role="alert" aria-live="assertive" aria-atomic="true" id="liveToast">
            <div class="toast-header">
                <img src="../assets/img/favicon.ico" class="rounded me-2" alt="Ícone da lista da tarefas"
                    id="icone-toast">
                <strong class="me-auto">Minha Lista de Tarefas</strong>
                <small>Agora mesmo</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body">
                Utilizador guardado<br>Faz Iniciar sessão para aceder à tua sessão
            </div>
        </div>
    </div>
    <!-- Fim Toast do Bootstrap -->


    <!-- Início Alert do Bootstrap -->
        <div class="alert alert-primary alert-primary-meu d-none mx-auto w-auto text-left" role="alert"
            id="mensagem-sobre-imagem">
        </div>
    <!-- Fim Alert do Bootstrap -->

    <!-- Bootstrap js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- Meu js -->
    <script src="../assets/js/main.js"></script>
</body>
</html>
